version: '3.8'

services:
  backend:
    build: .
    container_name: bukuwarung-voice-api
    ports:
      - "7070:7070"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - BUKUWARUNG_API_BASE=${BUKUWARUNG_API_BASE:-https://api-dev.bukuwarung.com/golden-gate/api/edc}
      - BUKUWARUNG_TOKEN=${BUKUWARUNG_TOKEN}
      - BUKUWARUNG_SESSION=${BUKUWARUNG_SESSION}
    volumes:
      - ./static:/app/static
    restart: unless-stopped